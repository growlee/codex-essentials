name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate package
        shell: pwsh
        run: ./scripts/validate-package.ps1
      - name: Test routing matrix
        shell: pwsh
        run: ./scripts/test-routing-matrix.ps1
      - name: Test runtime sync
        shell: pwsh
        run: ./scripts/test-sync-runtime.ps1

  portable-tools:
    name: Portable tools (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test portable agent installer
        run: python scripts/test-install-agents.py
      - name: Test read-only harness auditor
        run: python scripts/test-audit-harness.py
