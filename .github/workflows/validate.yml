name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate package
        shell: pwsh
        run: ./scripts/validate-package.ps1
      - name: Test routing matrix
        shell: pwsh
        run: ./scripts/test-routing-matrix.ps1
      - name: Test runtime sync
        shell: pwsh
        run: ./scripts/test-sync-runtime.ps1

  portable-agent-installer:
    name: Agent installer (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test portable agent installer
        run: python scripts/test-install-agents.py
